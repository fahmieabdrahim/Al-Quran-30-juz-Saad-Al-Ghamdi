<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Quran 30 juz - Saad Al Ghamdi</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center pt-28 pb-24 px-4">

    <!-- Pemain Audio Ala Spotify (Melekat di Atas & Tiada Garisan) -->
    <div class="fixed top-0 left-0 w-full bg-slate-900/95 backdrop-blur py-3 px-4 shadow-lg z-50 flex justify-center">
        <div class="w-full max-w-md">
            <!-- Tajuk & Info -->
            <div class="text-center mb-2">
                <h1 class="text-lg font-bold tracking-tight text-white">Al-Quran 30 juz</h1>
                <p id="now-playing" class="text-xs text-slate-400 truncate font-medium">Saad Al Ghamdi</p>
            </div>

            <!-- Elemen Audio Asal (Disembunyikan) -->
            <audio id="audio-player" class="hidden"></audio>

            <!-- Bar Progress Masa -->
            <div class="flex items-center gap-2 text-xs text-slate-400 font-mono mb-2">
                <span id="current-time">00:00</span>
                <input type="range" id="progress-bar" value="0" max="100" class="w-full h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-500">
                <span id="duration-time">00:00</span>
            </div>

            <!-- Panel Butang Kawalan Ikon Ala Spotify -->
            <div class="flex items-center justify-between px-6 py-1">
                <!-- Butang Shuffle -->
                <button id="btn-shuffle" onclick="toggleShuffle()" title="Rawak (Shuffle)" class="text-slate-400 hover:text-white transition cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 8h.01"></path></svg>
                </button>

                <!-- Butang Previous -->
                <button onclick="playPrev()" title="Sebelumnya" class="text-slate-300 hover:text-white transition cursor-pointer">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>

                <!-- Butang Play / Pause Utama (Hijau & Tiada Bulatan Putih) -->
                <button onclick="togglePlayPause()" id="btn-play-pause" title="Main / Jeda" class="text-emerald-500 hover:text-emerald-400 transition cursor-pointer p-1">
                    <svg id="icon-play" class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="icon-pause" class="w-8 h-8 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>

                <!-- Butang Next -->
                <button onclick="playNext()" title="Seterusnya" class="text-slate-300 hover:text-white transition cursor-pointer">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>

                <!-- Butang Repeat -->
                <button id="btn-repeat" onclick="toggleRepeat()" title="Ulang" class="text-slate-400 hover:text-white transition relative cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span id="repeat-badge" class="absolute -top-1 -right-1 text-[9px] font-bold text-emerald-400 hidden">1</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Kaunter Senarai Surah (Tanpa Tab/Butang Penapis) -->
    <div class="w-full max-w-md flex items-center justify-between mb-4 px-1">
        <span id="list-counter" class="text-xs text-slate-400 font-medium">Senarai Surah (114)</span>
    </div>

    <!-- Senarai 114 Surah Penuh -->
    <main id="surah-list" class="w-full max-w-md divide-y divide-slate-800 mb-8">
        <div id="loading" class="text-center py-8 text-slate-500 text-sm">
            Memuatkan 30 Juz Al-Quran...
        </div>
    </main>

    <!-- Footer Teks Pilihan (Fixed Bottom & Tiada Garisan) -->
    <footer class="fixed bottom-0 left-0 w-full bg-slate-900/95 backdrop-blur py-3 px-4 shadow-lg z-40 flex justify-center">
        <div class="w-full max-w-md text-center">
            <p class="text-xs text-slate-400">
                Semoga kita sentiasa dalam rahmat Allah
            </p>
        </div>
    </footer>

    <!-- Skrip JavaScript -->
    <script>
        let currentElement = null;
        let currentIndex = -1;
        let chaptersData = [];
        let isShuffle = false;
        let repeatMode = 0; 
        let likedSurahs = JSON.parse(localStorage.getItem('likedSurahs')) || [];

        const audioElement = document.getElementById('audio-player');
        const nowPlayingText = document.getElementById('now-playing');
        const surahListContainer = document.getElementById('surah-list');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeEl = document.getElementById('current-time');
        const durationTimeEl = document.getElementById('duration-time');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');
        const btnRepeat = document.getElementById('btn-repeat');
        const repeatBadge = document.getElementById('repeat-badge');
        const btnShuffle = document.getElementById('btn-shuffle');
        const listCounter = document.getElementById('list-counter');

        const AUDIO_BASE_URL = "https://server7.mp3quran.net/s_gmd/";

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === Infinity) return "00:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        async function fetchSurahs() {
            try {
                const response = await fetch('https://api.quran.com/api/v4/chapters?language=ms');
                const data = await response.json();
                chaptersData = data.chapters;
                renderSurahList();
            } catch (error) {
                console.error("Gagal memuatkan senarai surah:", error);
                surahListContainer.innerHTML = `<div class="text-center py-8 text-red-400 text-sm">Gagal memuatkan data dari API.</div>`;
            }
        }

        function toggleLike(event, chapterId) {
            event.stopPropagation();
            const index = likedSurahs.indexOf(chapterId);
            if (index > -1) {
                likedSurahs.splice(index, 1);
            } else {
                likedSurahs.push(chapterId);
            }
            localStorage.setItem('likedSurahs', JSON.stringify(likedSurahs));
            renderSurahList();
        }

        // Tentukan senarai giliran main (Playlist) secara automatik:
        // - Jika surah yang sedang/hendak dimainkan ada dalam senarai 'likedSurahs', playlist HANYA mengandungi surah-surah yang di-like sahaja.
        // - Jika tidak, playlist mengandungi kesemua 114 surah.
        function getPlayQueue(targetChapterId) {
            const isTargetLiked = likedSurahs.includes(targetChapterId);
            if (isTargetLiked && likedSurahs.length > 0) {
                // Sentiasa susun mengikut urutan nombor surah asal yang di-like
                return chaptersData.filter(chapter => likedSurahs.includes(chapter.id));
            }
            return chaptersData;
        }

        function renderSurahList() {
            surahListContainer.innerHTML = '';
            
            chaptersData.forEach((chapter) => {
                const isLiked = likedSurahs.includes(chapter.id);
                const isCurrentPlaying = (currentIndex === chapter.id - 1);

                const div = document.createElement('div');
                div.className = "py-3 px-3 flex items-center justify-between cursor-pointer hover:bg-slate-800/60 transition rounded-lg";
                if (isCurrentPlaying) {
                    div.classList.add('bg-slate-800', 'font-semibold');
                    currentElement = div;
                }
                
                div.innerHTML = `
                    <div class="flex items-center gap-3 pr-2 overflow-hidden">
                        <span class="text-xs font-semibold text-slate-500 w-6 text-right shrink-0">${chapter.id}.</span>
                        <h2 class="text-sm font-medium text-slate-300 truncate">${chapter.name_simple} (${chapter.translated_name.name})</h2>
                    </div>
                    <div class="flex items-center gap-3 shrink-0">
                        <button onclick="toggleLike(event, ${chapter.id})" title="Suka" class="p-1 text-slate-400 hover:text-rose-500 transition cursor-pointer">
                            <svg class="w-5 h-5 ${isLiked ? 'text-rose-500 fill-rose-500' : ''}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                            </svg>
                        </button>
                        <span id="duration-${chapter.id}" class="text-xs text-slate-500 font-mono">--:--</span>
                    </div>
                `;

                div.onclick = () => playChapter(chapter.id);
                surahListContainer.appendChild(div);
            });
        }

        function playChapter(chapterId) {
            currentIndex = chapterId - 1;
            const chapter = chaptersData[currentIndex];
            if (!chapter) return;

            const formattedId = String(chapter.id).padStart(3, '0');
            const audioUrl = `${AUDIO_BASE_URL}${formattedId}.mp3`;
            
            renderSurahList();

            audioElement.src = audioUrl;
            audioElement.play().then(() => {
                updatePlayPauseIcons(true);
            }).catch(error => {
                console.log("Gagal memainkan audio:", error);
            });

            if (currentElement) {
                currentElement.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
            
            nowPlayingText.innerText = `Surah ${chapter.name_simple} - Saad Al Ghamdi`;

            audioElement.onloadedmetadata = () => {
                durationTimeEl.innerText = formatTime(audioElement.duration);
                const durationSpan = document.getElementById(`duration-${chapter.id}`);
                if (durationSpan) {
                    durationSpan.innerText = formatTime(audioElement.duration);
                }
            };
        }

        function togglePlayPause() {
            if (!audioElement.src) {
                if (chaptersData.length > 0) {
                    playChapter(chaptersData[0].id);
                }
                return;
            }
            if (audioElement.paused) {
                audioElement.play();
                updatePlayPauseIcons(true);
            } else {
                audioElement.pause();
                updatePlayPauseIcons(false);
            }
        }

        function updatePlayPauseIcons(isPlaying) {
            if (isPlaying) {
                iconPlay.classList.add('hidden');
                iconPause.classList.remove('hidden');
            } else {
                iconPlay.classList.remove('hidden');
                iconPause.classList.add('hidden');
            }
        }

        function playPrev() {
            const currentActiveId = currentIndex + 1;
            let queue = getPlayQueue(currentActiveId);
            if (queue.length === 0) return;

            let queueIndex = queue.findIndex(c => c.id === currentActiveId);
            if (queueIndex > 0) {
                playChapter(queue[queueIndex - 1].id);
            } else {
                playChapter(queue[queue.length - 1].id);
            }
        }

        function playNext() {
            const currentActiveId = currentIndex + 1;
            let queue = getPlayQueue(currentActiveId);
            if (queue.length === 0) return;

            if (isShuffle) {
                const randomItem = queue[Math.floor(Math.random() * queue.length)];
                playChapter(randomItem.id);
                return;
            }

            let queueIndex = queue.findIndex(c => c.id === currentActiveId);
            if (queueIndex !== -1 && queueIndex < queue.length - 1) {
                playChapter(queue[queueIndex + 1].id);
            } else {
                playChapter(queue[0].id);
            }
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            btnShuffle.classList.toggle('text-emerald-400', isShuffle);
            btnShuffle.classList.toggle('text-slate-400', !isShuffle);
        }

        function toggleRepeat() {
            repeatMode = (repeatMode + 1) % 3;
            if (repeatMode === 0) {
                btnRepeat.classList.remove('text-emerald-400');
                btnRepeat.classList.add('text-slate-400');
                repeatBadge.classList.add('hidden');
            } else if (repeatMode === 1) {
                btnRepeat.classList.add('text-emerald-400');
                repeatBadge.classList.add('hidden');
            } else if (repeatMode === 2) {
                btnRepeat.classList.add('text-emerald-400');
                repeatBadge.classList.remove('hidden');
            }
        }

        audioElement.ontimeupdate = () => {
            if (audioElement.duration) {
                const progressPercent = (audioElement.currentTime / audioElement.duration) * 100;
                progressBar.value = progressPercent;
                currentTimeEl.innerText = formatTime(audioElement.currentTime);
            }
        };

        progressBar.oninput = () => {
            if (audioElement.duration) {
                audioElement.currentTime = (progressBar.value / 100) * audioElement.duration;
            }
        };

        audioElement.onended = () => {
            if (repeatMode === 2) {
                audioElement.currentTime = 0;
                audioElement.play();
            } else {
                playNext();
            }
        };

        fetchSurahs();
    </script>
</body>
</html>
